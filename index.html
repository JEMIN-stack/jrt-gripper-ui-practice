<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>JRT Gripper Control</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>JRT Gripper Control</h1>

    <section>
        <h2>Connection</h2>

        <p>
            Status :
            <span id="connectionStatus">
                DISCONNECTED
            </span>
        </p>

        <button id="btnConnect">
            Connect
        </button>

        <button id="btnDisconnect">
            Disconnect
        </button>
    </section>

    <section>
        <h2>Motion Parameters</h2>

        <div>
            <label for="inputPosition">Position</label>
            <input id="inputPosition" 
                        type="number" 
                        min="0"
                        max="1000"
                        value="500">
        </div>

        <div>
            <label for="inputSpeed">Speed</label>
            <input id="inputSpeed" 
                        type="number" 
                        min="0"
                        max="100"
                        value="50">
        </div>

        <div>
            <label for="inputTorque">Torque</label>
            <input id="inputTorque" 
                        type="number" 
                        min="0"
                        max="100"
                        value="50">
        </div>

        <div>
            <label for="inputInternalRange">Internal Range</label>
            <input id="inputInternalRange" type="number">
        </div>

        <div>
            <label for="inputExternalRange">External Range</label>
            <input id="inputExternalRange" type="number">
        </div>
        
        <div>
            <label for="selectGripMode">Grip Mode</label>
            <select id="selectGripMode">
                <option value="default">Default</option>
                <option value="fast">Fast Approach</option>
                <option value="soft">Soft Contact</option>
                <option value="fast_soft">Fast + Soft</option>
            </select>
        </div>
    
    </section>

    <section>
        <h2>Preset</h2>

            
            <h3>Standby Preset</h3>
            <div>
                <label for="inputStandbyPreset">Preset number</label>
                <input id="inputStandbyPreset" 
                       type="number"
                       min="1"
                       max="5"
                       value="1" >
            </div>

            <button id="btnSaveStandbyPreset">
                Save
            </button>

            <button id="btnRunStandbyPreset">
                Run
            </button>

        
            <h3>Grip Preset</h3>
            <div>
                <label for="inputGripPreset">Preset number</label>
                <input id="inputGripPreset" 
                            type="number"
                            min="1"
                            max="10"
                            value="1">
                            

            </div>
            
            <button id="btnSaveGripPreset">
                Save
            </button>

            <button id="btnRunGripPreset">
                Run
            </button>

    </section>

   <section>

        <h2>Motion</h2>

        <button id ="btnOpen">
            Open
        </button>
    
        <button id ="btnClose">
            Close
        </button>

        <button id = "btnStandby">
            Standby
        </button>

        <button id = "btnGrip">
            Grip
        </button>

        <button id = "btnStop">
            Stop
        </button>

   </section>

   <section>
        <h2>Feedback</h2>

        <p>
            Position :
            <span id="actualPosition">0</span>
        </p>

        <p>
            Speed :
            <span id="actualSpeed">0</span>
        </p>

        <p>
            Torque:
            <span id="actualTorque">0</span>
        </p>

        <p>
            Current Operation :
            <span id = "currentOperation">IDLE</span>
        </p>

        <p>
            Grip Detected :
            <span id = "gripDetected">false</span>
        </p>

   </section>

   <section>

        <h2>Log</h2>

        <div id="logArea">
            System Ready
        </div>

   </section>

    <script src="app.js"></script>

</body>
